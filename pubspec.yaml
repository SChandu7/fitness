name: fitness
description: Exerlio — train, track, recover, connect.
publish_to: 'none'
version: 3.0.0+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  video_player: ^2.14.1
  share_plus: ^13.3.1
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  health: ^13.3.2
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  # Inter is bundled (SIL Open Font License, see assets/fonts/LICENSE.txt):
  # works offline on first launch and never calls a font server.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
